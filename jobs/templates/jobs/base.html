
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}JobTrack{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    {% load static %}
    <link rel="stylesheet" href="{% static 'jobs/css/style.css' %}">
</head>

<body>

<nav class="navbar navbar-dark" style="background:#172b4d;">
    <div class="container">
        <a class="navbar-brand fw-bold" href="{% url 'dashboard' %}">
            JobTrack
        </a>

        {% if user.is_authenticated %}
            <div class="d-flex align-items-center gap-3">
                <span class="text-white">Hello, {{ user.username }}</span>

                <form method="post" action="{% url 'logout' %}">
                    {% csrf_token %}
                    <button class="btn btn-light btn-sm" type="submit">
                        Logout
                    </button>
                </form>
            </div>
        {% else %}
            <div>
                <a href="{% url 'login' %}" class="btn btn-outline-light btn-sm">
                    Login
                </a>
                <a href="{% url 'register' %}" class="btn btn-light btn-sm">
                    Register
                </a>
            </div>
        {% endif %}
    </div>
</nav>

<main class="container py-4">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-success">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'jobs/js/script.js' %}"></script>

{% block extra_js %}
{% endblock %}

</body>
</html>
